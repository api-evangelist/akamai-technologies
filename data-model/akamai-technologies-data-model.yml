description: 'Two distinct entity graphs sit under the Akamai name. The EdgeGrid control plane hangs everything
  off the commercial hierarchy - account > contract > group - and every configuration object (property, include,
  security config, CP code, certificate enrollment) is created inside a contract and group, which is why contractId
  and groupId are query parameters on nearly every collection. Below that, the platform is version-and-activation
  shaped: you never edit a live object, you create a new version, edit that, and activate it to staging or production.
  Akamai Cloud (Linode) is a flat resource graph keyed on numeric ids with region as the placement axis.'
id_conventions:
- surface: edgegrid
  pattern: prefixed opaque ids
  examples:
  - prp_123456 (property)
  - ctr_C-1234 (contract)
  - grp_12345 (group)
  - cpc_12345 (CP code)
  - ehn_12345 (edge hostname)
  - atv_1234567 (activation)
  - inc_12345 (include)
  note: The PAPI-Use-Prefixes request header (70 operations) toggles whether ids come back prefixed or bare - a
    genuine trap for a client that assumes one form.
- surface: linode
  pattern: bare integers plus string slugs
  examples:
  - linodeId 12345
  - region us-east
  - type g6-standard-2
  - image linode/ubuntu24.04
entities:
- name: Account
  surface: edgegrid
  note: The billing and identity root. accountSwitchKey selects a managed account.
