generated: '2026-08-30'
method: searched
source: https://github.com/akamai-developers/akamai-cloud-mcp
name: Akamai Cloud MCP Server
status: published
description: 'Akamai publishes one official Model Context Protocol server, akamai-cloud-mcp, covering Akamai Cloud
  (Linode). It is read-only by construction - a GET-only HTTP client, an allowlist serializer and a recursive secret
  scrub, enforced by a static scan and a runtime verb guard - and exposes 37 curated tools across ten loadable domains
  plus one read-only escape hatch. There is no vendor-hosted endpoint: the server is distributed on PyPI and run
  by the consumer over stdio, or self-hosted behind the auth-gated streamable-http transport. No MCP server is published
  for the EdgeGrid control-plane APIs (Property Manager, purge, security, identity); those remain REST only.'
deployment:
  mode: local-stdio
  install: uvx akamai-cloud-mcp
  package: https://pypi.org/project/akamai-cloud-mcp/
  auth: api-key
  verified: searched
  note: The server also ships a streamable-http transport (--transport streamable-http, default bind 127.0.0.1:8080,
    path /mcp, bearer token required via AKAMAI_MCP_HTTP_AUTH_TOKEN) but Akamai publishes no hosted endpoint URL
    for it, so an agent cannot reach an Akamai-operated MCP server today - the consumer must run or host it.
repository: https://github.com/akamai-developers/akamai-cloud-mcp
license: Apache-2.0
runtime: Python 3.11+
transports:
- stdio
- streamable-http (self-hosted, bearer-gated)
domains:
- regions
- pricing
- compute
- lke
- object_storage
- networking
- account
- dns
- databases
- escape
authentication:
  credential: Linode personal access token (LINODE_TOKEN, alias LINODE_API_TOKEN)
  scopes_recommended:
  - linodes:read_only
  - lke:read_only
  - object_storage:read_only
  - nodebalancers:read_only
  - firewall:read_only
  - vpc:read_only
  - ips:read_only
  - account:read_only
  - events:read_only
  note: Pricing and catalog tools work with no token; account-scoped tools require one.
tool_count: 37
tools:
