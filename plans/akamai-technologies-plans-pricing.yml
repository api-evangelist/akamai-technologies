description: Akamai is two pricing companies. Akamai Cloud (Linode) publishes a complete, keyless, MACHINE-READABLE
  price catalog - six unauthenticated endpoints on api.linode.com return every compute plan, volume, NodeBalancer,
  LKE control-plane tier, Object Storage class and network-transfer overage rate with hourly and monthly prices.
  That is rare and it is the strongest thing in this artifact. The rest of Akamai - CDN, security, edge compute,
  DNS, NetStorage - publishes no price at all and is sold on a negotiated enterprise contract. This file records
  both facts rather than averaging them.
