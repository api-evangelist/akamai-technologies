specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Akamai Technologies
providerId: akamai-technologies
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - CDN
  - Edge
  - Cloud
  - Security
  - Multi-Service
description: Akamai Technologies is a multi-product platform spanning CDN, edge compute (EdgeWorkers),
  application/API security (App & API Protector, Bot Manager, Account Protector), Akamai Cloud
  Computing (formerly Linode — public per-instance, per-GB rates), DNS, NetStorage, and observability
  (mPulse). CDN, Security, and Edge products are typically priced via custom quote against expected
  traffic / requests / GB egress with reserved-commitment discounts; Akamai Cloud Computing is the one
  major surface with a published per-plan price list. New customers can take advantage of trial /
  starter credits on Cloud Computing.
sources:
  - https://www.akamai.com/products/pricing
  - https://www.akamai.com/cloud/pricing
plans:
  - id: akamai-technologies-platform-overview
    name: Platform Pricing Overview
    type: enterprise
    description: Per-service pricing across the Akamai portfolio. CDN / Security / Edge surfaces are
      quoted; Akamai Cloud Computing has a public price list.
    entries:
      - label: Per-service rates
        name: varies
        type: metered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see vendor pricing pages
        userMultiplied: false
    elements:
      - name: Akamai CDN (Ion, DSA)
      - name: Akamai Image & Video Manager
      - name: Akamai EdgeWorkers (serverless)
      - name: Akamai App & API Protector (WAF / DDoS / Bot)
      - name: Akamai Account Protector
      - name: Akamai Cloud Computing (Linode-based)
      - name: Akamai NetStorage
      - name: Akamai Edge DNS
      - name: Akamai mPulse (Real User Monitoring)
  - id: akamai-technologies-cloud-computing
    name: Akamai Cloud Computing (Linode)
    type: pay-as-you-go
    description: Akamai Cloud Computing publishes a per-instance / per-GB price list (Shared CPU,
      Dedicated CPU, High Memory, Premium, GPU; Block and Object Storage; Network Transfer). Detailed
      rates are listed on the vendor pricing page.
    entries:
      - label: Compute, storage, and network rates
        name: cloud_computing_rates
        type: metered
        metric: varies
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: see https://www.akamai.com/cloud/pricing
        userMultiplied: false
    elements:
      - name: Shared / Dedicated / High Memory / Premium / GPU compute plans
      - name: Block Storage and Object Storage
      - name: Bundled network transfer with overage
      - name: Linode-compatible APIs and CLI
  - id: akamai-technologies-committed-use
    name: Committed Use / Reserved
    type: enterprise
    description: 1-year and multi-year commitments deliver substantial discounts vs on-demand for
      high-volume CDN, Security, and Cloud customers.
    entries:
      - label: Multi-year commitment
        name: committed
        type: subscription
        metric: year
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: custom
        userMultiplied: false
    elements:
      - name: Reserved Instances / Committed Use Discounts
      - name: Volume traffic / request / GB tiers
      - name: Negotiated enterprise agreements
  - id: akamai-technologies-free-trial
    name: Free Trial / Starter Credits
    type: freemium
    description: Akamai offers trial credits for Cloud Computing and limited evaluation access for
      other services.
    entries:
      - label: Trial credits
        name: trial_credits
        type: quota
        metric: credit
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Cloud Computing trial credits
      - name: Sandbox / evaluation access on enterprise products
maintainers:
