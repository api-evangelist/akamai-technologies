description: 'Akamai publishes no AsyncAPI description. It does run a real event surface, and it is push-based:
  DataStream 2 delivers live log events from the edge to a destination the customer configures, and one of the twelve
  destination types is a plain customer-owned HTTPS endpoint - a webhook in everything but name. SIEM Integration
  is the pull-side sibling (poll for security events), Alerts fires notifications on origin and delivery conditions,
  and Security Notification Settings routes security alerts to Slack, Microsoft Teams, PagerDuty and custom webhooks.
  None of these carry a machine-readable event schema catalog, which is the real gap: an agent can subscribe but
  cannot discover the payload shape from a contract.'
