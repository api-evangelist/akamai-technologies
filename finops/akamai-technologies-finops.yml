principles:
  - name: Visibility
    description: Use Akamai Control Center reporting + the Reporting and Billing OPEN APIs for
      programmatic visibility; on Akamai Cloud Computing, use the Linode billing endpoints. Tag
      resources with cp_code (CDN / Security) and tags (Cloud Computing) for downstream allocation.
  - name: Allocation
    description: Allocate CDN and Security spend by cp_code and property; Cloud Computing by Linode
      tags and resource group; EdgeWorkers by worker name; Reporting can be sliced per business unit
      via cp_code grouping.
  - name: Optimization
    description: Optimize through committed-use / reserved tiers on CDN traffic and Cloud Computing,
      right-sizing compute plans, choosing block vs object storage appropriately, leveraging cache-hit
      ratio improvements to reduce origin egress, and tuning Image/Video Manager output formats.
  - name: Accountability
    description: Platform / SRE typically owns Akamai spend with finance partnering on reserved
      commitments; review reserved tiers ahead of contract renewal and after major launches that
      change traffic baselines.
