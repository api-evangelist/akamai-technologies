description: Akamai Technologies operates one of the world's largest distributed edge platforms, spanning content
  delivery (Ion, Adaptive Media Delivery, Download Delivery), application and API security (App & API Protector,
  Bot Manager, Prolexic DDoS, Secure Internet Access, Guardicore segmentation), edge compute (EdgeWorkers, EdgeKV,
  Akamai Functions), DNS and traffic management (Edge DNS, Global Traffic Management), NetStorage, and Akamai Cloud
  Computing - the Linode-based public cloud acquired in 2022. Akamai publishes first-party OpenAPI descriptions
  for its control-plane APIs in the akamai/akamai-apis GitHub repository and for the Linode API in linode/linode-api-openapi,
  covering property configuration, certificate provisioning, purge, identity and access management, security configuration,
  reporting, diagnostics, test automation and cloud provisioning. All Akamai control-plane APIs authenticate with
  the EdgeGrid HMAC-SHA256 request-signing scheme against a per-account hostname; the Linode API uses OAuth 2.0
  and personal access tokens.
