description: 'Akamai answers errors as RFC 7807 problem documents across essentially the whole control plane: of
  the 3381 error-response media types declared in the harvested specs, 3199 are application/problem+json and 28
  are the older application/api-problem+json (Fast Purge). Only a small remainder fall back to plain application/json.
  The envelope carries `type` (a URI that resolves to the per-product error reference), `title`, `detail`, `instance`
  and `status`; Fast Purge additionally returns `supportId`, `describedBy`, and, on 429, the live `rateLimit` /
  `rateLimitRemaining` / `rateLimitCurrentRequestSize` counters. There is no single cross-product error-code registry
  - each API publishes its own error reference under techdocs.akamai.com/<product>/reference/api-errors.'
