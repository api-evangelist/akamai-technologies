description: 'Akamai distributes EdgeGrid request SIGNERS rather than generated per-API clients for its control
  plane - the signer plus any HTTP client is the supported integration path - and full typed clients only for Go
  (AkamaiOPEN-edgegrid-golang, which backs the Terraform provider) and PowerShell. Akamai Cloud (Linode) is the
  opposite: first-party typed clients in Python, Go and TypeScript plus a CLI. The two NetStorage kits are the clear
  decay signal - both last published in 2018 against an API that is still in the current catalog.'
