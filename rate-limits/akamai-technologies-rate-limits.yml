specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Akamai Technologies
providerId: akamai-technologies
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: true
tags:
  - CDN
  - Edge
  - Cloud
  - Security
  - Rate Limiting
description: Akamai is a multi-service platform; API rate limits vary by product surface. Control-plane
  APIs (Akamai EdgeGrid OPEN APIs covering CDN configuration, Property Manager, Cloud Computing,
  EdgeWorkers, Security configuration, Reporting, Identity, etc.) each have service-specific
  throttles. Akamai Cloud Computing inherits the published Linode API rate limits. Throttling
  responses follow standard 429 / Retry-After conventions; specific numeric limits are documented in
  per-service Akamai TechDocs / API reference pages.
notes: Per-service limits are documented in TechDocs rather than a single rate-limit page. Consumers
  should check the relevant API reference for canonical limits.
sources:
  - https://techdocs.akamai.com/
  - https://www.linode.com/docs/api/
responseCodes:
  throttled: 429
  serviceUnavailable: 503
limits:
  - name: EdgeGrid Control-Plane APIs
    scope: api_client
    metric: varies
    limit: service-specific TPS / RPM, see per-API TechDocs
    notes: Property Manager, Cloud Computing, Security Configuration, Reporting, etc. each publish
      their own rate-limit ceilings; EdgeGrid signing is required.
  - name: Cloud Computing (Linode) API
    scope: account
    metric: varies
    limit: see Linode API rate-limit documentation
    notes: Linode API publishes documented per-endpoint limits and uses the X-RateLimit-* family of
      headers.
  - name: CDN edge request volume
    scope: account
    metric: varies
    limit: governed by contract (committed traffic / requests / RPS), not a public number
policies:
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429 / 503 responses,
      honoring Retry-After when present.
  - name: EdgeGrid Authentication
    description: Akamai control-plane APIs require EdgeGrid request signing; misconfigured clients
      can be blocked before reaching rate limits.
  - name: Per-Service Limits
    description: Numeric limits are published per API in TechDocs. Treat them as authoritative — do
      not infer one product's limits from another.
  - name: Contract-Governed CDN Capacity
    description: CDN traffic capacity is contractual, not an API rate limit. Coordinate with the
      Akamai account team before unusual traffic events.
maintainers:
