undocumented:
  surfaces: The EdgeGrid configuration APIs (Property Manager, AppSec, Edge DNS, GTM, CPS, Identity and Access Management
    and the rest) publish no numeric ceiling in either the specs or the reference pages consulted here.
  behaviour: Exhaustion is signalled as 429 with an RFC 7807 body; clients should back off exponentially with jitter.
policies:
- name: Backoff
  description: Exponential backoff with jitter on 429 and 503; honour X-Ratelimit-Seconds-To-Refresh-Limit where
    returned.
- name: Read the limit before the burst
  description: Fast Purge exposes post-rate-limit-status so a client can read its current headroom rather than discover
    it with a 429.
- name: Contract capacity is not a rate limit
  description: CDN traffic capacity is contractual; coordinate large events with the account team rather than treating
    it as an API throttle.
