provider: Akamai Technologies
providerId: akamai-technologies
description: Akamai publishes real numbers on the two surfaces that need them most. Fast Purge declares per-object-type
  burst and sustained limits and returns eight X-Ratelimit-* headers on every accepted purge, including the seconds-to-refresh
  value an agent needs to schedule its next call. The Linode (Akamai Cloud) API publishes a documented default of
  1600 requests/minute, 200/minute for paginated GET collections, with named exceptions per operation. The remaining
  EdgeGrid configuration APIs do not publish a numeric ceiling - their limits are contract-governed and surfaced
  only as a 429.
